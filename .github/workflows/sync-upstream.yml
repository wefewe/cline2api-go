name: Sync upstream source from luawei1/cline2api

# 上游：https://github.com/luawei1/cline2api (MIT)。本 workflow 定时拉取其最新
# Release tag 的源码同步进 upstream/，有变化则提交，进而触发 build.yml 重新构建镜像。
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # 同步后显式 dispatch build.yml（workflow_dispatch 不受 GITHUB_TOKEN 触发限制）
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch latest upstream tag
        run: |
          set -euo pipefail
          tag=$(curl -sSL https://api.github.com/repos/luawei1/cline2api/releases/latest \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          echo "tag: $tag"
          curl -sSL -o /tmp/u.tgz "https://github.com/luawei1/cline2api/archive/refs/tags/${tag}.tar.gz"
          rm -rf /tmp/x && mkdir -p /tmp/x
          tar xzf /tmp/u.tgz -C /tmp/x
          src=$(find /tmp/x -maxdepth 1 -type d -name 'cline2api-*' | head -1)
          test -n "$src" || { echo "source dir not found"; exit 1; }
          rm -rf upstream && mkdir -p upstream
          cp -a "$src"/. upstream/
          rm -rf upstream/.github upstream/.git
          echo "$tag" > upstream/UPSTREAM-TAG.txt

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # -f：上游 .gitignore 会忽略 *_test.go，强制纳入以保持源码快照完整
            git add -A -f
            git commit -m "chore: sync upstream luawei1/cline2api"
            git push
            echo "✅ upstream updated and pushed"
            gh workflow run build.yml --repo "$GITHUB_REPOSITORY"
          else
            echo "✅ upstream already up to date"
          fi
